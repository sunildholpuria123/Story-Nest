name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build StoryNest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        env:
          STORYNEST_API_BASE_URL: ${{ vars.STORYNEST_API_BASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "STORYNEST_API_BASE_URL=$STORYNEST_API_BASE_URL"
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
          } > local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename debug APK with version
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\\s*=\\s*"\\K[^"]+' app/build.gradle.kts)
          APK_DIR="app/build/outputs/apk/debug"
          cp "$APK_DIR/app-debug.apk" "$APK_DIR/story_nest_debug_v${VERSION_NAME}.apk"
          echo "Created story_nest_debug_v${VERSION_NAME}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: story_nest_debug_v${{ github.run_number }}
          path: app/build/outputs/apk/debug/story_nest_debug_v*.apk
