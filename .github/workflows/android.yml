name: Android CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:

    name: Build StoryNest
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # JDK
      # ---------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------
      # Make Gradle executable
      # ---------------------------------------------------------

      - name: Grant execute permission
        run: chmod +x gradlew

      # ---------------------------------------------------------
      # Unit Tests
      # ---------------------------------------------------------

      - name: Run unit tests
        run: ./gradlew test

      # ---------------------------------------------------------
      # Build Debug APK
      # ---------------------------------------------------------

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryNest-debug-apk
          path: app/build/outputs/apk/debug/*.apk
